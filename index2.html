<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style1.css">
    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

}
.container{
    width: 400px;
    height: 40px;
    border: 2px solid black;
    background-color: rgb(36,173,136);
    border-radius: 6px;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px solid rgb(25,192,139,0.892);

}
.btn1{
     width: 130px;
     height: 35px;
     border: none;
     background-color: rgb(36,173,136);
     color: white;
     border-right: 1px solid white;
     transition: 0.3 ease;
     border-radius: 2px;
}
.btn2{
    width: 130px;
    height: 35px;
    border: none;
    color: white;
    border-right: 1px solid white;
    transition: 0.3 ease;
}
.btn3{
    width: 130px;
    height: 35px;
    border: none;
    background: none;
    color: white;
    transition: 0.3 ease;
}
.btn1:hover:hover{
    background-color: rgb(7,92,69);
}
.btn2:hover{
      background-color: rgb(7,92,69);
}
.btn3:hover:hover:hover{
    background-color: rgb(7,92,69);
}

    </style>
</head>
<body>
    <div class="container">
      <a href="#" class="btn1">Last Month</a>
      <a href="#" class="btn2">Today</a>
      <a href="#" class="btn3">Next Month</a>
    </div>
</body>
</html>
